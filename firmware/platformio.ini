; eyesteer MCU firmware. `make firmware` builds every env; `make flash` uploads the one in hardware.yaml.
; Pins and robot constants come from include/robot_constants*.h (generated by tools/generate_models.py).
[platformio]
default_envs = mega2560, uno, teensy41, esp32, mega2560_walker, teensy41_walker, esp32_walker

[env]
framework = arduino
monitor_speed = 57600
build_flags = -I include

[env:mega2560]
platform = atmelavr
board = megaatmega2560
build_flags = ${env.build_flags} -DEYESTEER_BOARD_MEGA2560

[env:mega2560_walker]
platform = atmelavr
board = megaatmega2560
build_flags = ${env.build_flags} -DEYESTEER_BOARD_MEGA2560 -DEYESTEER_WALKER

[env:uno]
; field robot only: the walker build (HX711 x2 + grip) needs more pins than the Uno's two interrupt pins allow comfortably
platform = atmelavr
board = uno
build_flags = ${env.build_flags} -DEYESTEER_BOARD_UNO

[env:teensy41]
platform = teensy
board = teensy41
build_flags = ${env.build_flags} -DEYESTEER_BOARD_TEENSY41

[env:teensy41_walker]
platform = teensy
board = teensy41
build_flags = ${env.build_flags} -DEYESTEER_BOARD_TEENSY41 -DEYESTEER_WALKER

[env:esp32]
platform = espressif32
board = esp32dev
build_flags = ${env.build_flags} -DEYESTEER_BOARD_ESP32

[env:esp32_walker]
platform = espressif32
board = esp32dev
build_flags = ${env.build_flags} -DEYESTEER_BOARD_ESP32 -DEYESTEER_WALKER

[env:native]
; host unit tests of lib/eyesteer_fw (needs a host gcc; `make firmware-test` uses g++ directly)
platform = native
framework =
build_flags = -I lib/eyesteer_fw -std=c++11
test_build_src = no
