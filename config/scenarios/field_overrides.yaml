# S4: engaged -> teleop takes over -> release -> resumes -> CANCEL -> WANDER -> e-stop -> everything stops -> reset
name: field_overrides
id: S4
title: "S4 · Human overrides: teleop, CANCEL, e-stop"
world: field
robot: field_robot
duration: 62
seed: 6
snr: 1.0
camera: chase
start_pose: [-3.6, -3.6, 0.785]
events:
  - {t: 0, caption: "The user selects B; the robot is ENGAGED."}
  - {t: 3, gaze: 2, dur: 3.5, engagement: 1.0}
