  - {t: 46, estop_release: true, caption: "E-stop button released, but the state stays latched until an explicit reset."}
  - {t: 50, reset: true, caption: "Operator reset → WANDER."}
stills:
  - {t: 16.0, name: teleop, caption: "Teleop override: mux source TELEOP while the goal B stays active."}
  - {t: 43.0, name: estop, caption: "E-stop latched: lock active, zero velocity."}
expect:
  selections: [2, 6]
  states_include: [ENGAGED, WANDER, ESTOP]
