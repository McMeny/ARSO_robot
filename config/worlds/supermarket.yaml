# Supermarket world: ~14 x 10 m, 4 shelving aisles, end caps, checkout, entrance (bottom-left).
name: supermarket
bounds: [-7.0, -5.0, 7.0, 5.0]
fence: {height: 2.2, thickness: 0.15}
field_polygon: [[-6.5, -4.5], [6.5, -4.5], [6.5, 4.5], [-6.5, 4.5]]
obstacles:
  # shelving units (long along y), 0.6 m deep, 1.8 m tall
  - {name: shelf_1, type: box, x: -4.0, y: 0.4, sx: 0.6, sy: 5.2, h: 1.8, yaw: 0.0, rgba: [0.75, 0.55, 0.35, 1]}
  - {name: shelf_2, type: box, x: -1.3, y: 0.4, sx: 0.6, sy: 5.2, h: 1.8, yaw: 0.0, rgba: [0.75, 0.55, 0.35, 1]}
  - {name: shelf_3, type: box, x: 1.4, y: 0.4, sx: 0.6, sy: 5.2, h: 1.8, yaw: 0.0, rgba: [0.75, 0.55, 0.35, 1]}
  - {name: shelf_4, type: box, x: 4.1, y: 0.4, sx: 0.6, sy: 5.2, h: 1.8, yaw: 0.0, rgba: [0.75, 0.55, 0.35, 1]}
  # end caps (promo displays at the bottom of each shelf)
  - {name: endcap_1, type: box, x: -4.0, y: -2.5, sx: 0.8, sy: 0.4, h: 1.2, yaw: 0.0, rgba: [0.9, 0.3, 0.3, 1]}
  - {name: endcap_2, type: box, x: -1.3, y: -2.5, sx: 0.8, sy: 0.4, h: 1.2, yaw: 0.0, rgba: [0.9, 0.3, 0.3, 1]}
  - {name: endcap_3, type: box, x: 1.4, y: -2.5, sx: 0.8, sy: 0.4, h: 1.2, yaw: 0.0, rgba: [0.9, 0.3, 0.3, 1]}
  - {name: endcap_4, type: box, x: 4.1, y: -2.5, sx: 0.8, sy: 0.4, h: 1.2, yaw: 0.0, rgba: [0.9, 0.3, 0.3, 1]}
  # fridges along the back wall
  - {name: fridge, type: box, x: 0.0, y: 4.6, sx: 8.0, sy: 0.6, h: 2.0, yaw: 0.0, rgba: [0.85, 0.9, 0.95, 1]}
  # produce tables on the left
  - {name: produce_table, type: box, x: -6.2, y: 1.5, sx: 1.0, sy: 2.2, h: 0.9, yaw: 0.0, rgba: [0.35, 0.65, 0.3, 1]}
  # checkout counters (bottom right)
  - {name: checkout_1, type: box, x: 2.8, y: -4.4, sx: 1.6, sy: 0.5, h: 0.9, yaw: 0.0, rgba: [0.4, 0.4, 0.45, 1]}
  - {name: checkout_2, type: box, x: 6.0, y: -3.6, sx: 0.5, sy: 1.6, h: 0.9, yaw: 0.0, rgba: [0.4, 0.4, 0.45, 1]}
people:
  # shopper_1 crosses the cross-aisle once (north -> south) in front of the walker, then waits by the south wall
  - {name: shopper_1, radius: 0.25, speed: 0.45, path: [[-4.9, -2.85], [-4.9, -4.7]], loop: false, start_delay: 0.0}
  - {name: shopper_2, radius: 0.25, speed: 0.35, path: [[5.6, 3.6], [5.6, -1.8]]}
start_pose: [-6.0, -3.9, 0.0]       # entrance
default_markers: supermarket_default
