# Field robot: single source of truth (D14).
# Generates: URDF/xacro, MJCF, diff_drive_controller YAML, Nav2 footprint, firmware constants.
# All dimensions in meters / kg / radians (REP-103). Values marked "MEASURE" are placeholders.
name: field_robot
idle_mode: WANDER           # D11: field robot idles by wandering

base:
  shape: cylinder
  radius: 0.17              # MEASURE ON THE REAL ROBOT
  height: 0.10              # MEASURE ON THE REAL ROBOT
  ground_clearance: 0.02    # bottom of the chassis above the floor
  mass: 3.5                 # MEASURE ON THE REAL ROBOT

wheels:
  radius: 0.036             # MEASURE ON THE REAL ROBOT (odometry calibration: drive 1 m)
  width: 0.026
  separation: 0.235         # MEASURE ON THE REAL ROBOT (odometry calibration: rotate 360 deg)
  x: 0.0                    # axle position relative to base_link (base_link is on the axle)
  mass: 0.15

casters:                    # passive spheres; touch the floor
  - {name: front_caster, x: 0.13, y: 0.0, radius: 0.018}
  - {name: rear_caster, x: -0.13, y: 0.0, radius: 0.018}

lidar:
  x: 0.0
  y: 0.0
  z_above_ground: 0.20      # MEASURE ON THE REAL ROBOT
  yaw: 0.0
  radius: 0.035
  height: 0.04
  masked_sectors_deg: []    # nothing occludes the LiDAR on the field robot

imu: {x: 0.0, y: 0.0, z_above_ground: 0.06}
camera: {x: 0.15, y: 0.0, z_above_ground: 0.15}

limits:
  v_max: 0.6
  w_max: 1.5
  a_max: 0.8
  alpha_max: 3.0

footprint:
  type: circle
  radius: 0.17              # = base radius
  padding: 0.02

nav:
  inflation_radius: 0.45
  cost_scaling_factor: 3.0
  goal_xy_tolerance: 0.30
  goal_yaw_tolerance_deg: 20
  approach_distance: 0.6    # goal pose this far in front of the anchored marker point

pid:                        # firmware gains (ROSArduinoBridge integer convention: output = (Kp*e + Kd*de + Ki*I)/Ko)
  kp: 20
  kd: 12
  ki: 0
  ko: 50

calibration_decals:         # headset<->map two-point calibration (Section 14.4); on the top plate
  front: {x: 0.12, y: 0.0}
  rear: {x: -0.12, y: 0.0}
  plate_height: 0.12
