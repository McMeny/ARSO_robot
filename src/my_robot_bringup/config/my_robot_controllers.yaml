controller_manager: # control manager loads both and runs them in the same 50 Hz loop
  ros__parameters: 
  # read something from the command, and then update the next command and write the command to send to hardware
    update_rate: 50 # Hz

    joint_state_broadcaster: # one node; reports what the joints are doing
      type: joint_state_broadcaster/JointStateBroadcaster
    
    diff_drive_controller: # another node; drives the robot
      type: diff_drive_controller/DiffDriveController

diff_drive_controller: # defining the parameters for node: diff_drive_controller
  ros__parameters:
    left_wheel_names: ["left_wheel"]
    right_wheel_names: ["right_wheel"]
    # what are the wheels to control

    wheel_separation: 0.390000
    wheel_radius: 0.05


    # for reciving and sending velocity to create closed loop control
    # and also for odometry

    # we need to publish a new tf "odom": distance between point where robot starts and where it is now
    
    odom_frame_id: "odom"
    base_frame_id: "base_footprint"

    pos_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    enable_odom_tf: true

    publish_rate: 50.0 # Hz

    linear.x.max_velocity: 1.0
    linear.x.min_velocity: -1.0

    angular.z.max_velocity: 1.0
    angular.z.min_velocity: -1.0

