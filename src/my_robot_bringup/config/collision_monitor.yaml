# Nav2 collision monitor, standalone - the independent safety layer, last in the chain:
# cmd_vel_mux in, cmd_vel_out (the robot) out. The planner keeps further away than these
# zones, so in normal driving it never acts.
# Walker body: x -0.04..0.46, y -0.25..0.25 (base_footprint). The user is not in these polygons:
# on the real walker the lidar would see the user's legs and stop for ever.

collision_monitor:
  ros__parameters:
    use_sim_time: True
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_mux"
    cmd_vel_out_topic: "cmd_vel_out"
    transform_tolerance: 0.5
    source_timeout: 5.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    polygons: ["StopZone", "SlowdownZone"]
    StopZone:
      type: "polygon"
      action_type: "stop"
      points: [0.54, 0.33, 0.54, -0.33, -0.12, -0.33, -0.12, 0.33]   # body + 0.08 m
      max_points: 3
      visualize: True
      polygon_pub_topic: "collision_monitor/stop_zone"
      enabled: True
    SlowdownZone:
      type: "polygon"
      action_type: "slowdown"
      points: [0.81, 0.33, 0.81, -0.33, 0.46, -0.33, 0.46, 0.33]     # 0.35 m ahead of the front (brief: ~0.5 m;
                                                                      # the guardian stops ~0.45-0.55 m from walls, and Nav2 slows
                                                                      # any motion - even backing away - while a point is inside)
      slowdown_ratio: 0.5
      max_points: 3
      visualize: True
      polygon_pub_topic: "collision_monitor/slowdown_zone"
      enabled: True
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan"
      enabled: True
