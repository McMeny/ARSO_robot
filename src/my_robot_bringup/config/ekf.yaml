ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    two_d_mode: true
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # Wheel odometry - forward and sideways speed only (not turning; that's what slips)
    odom0: /odom
    odom0_config: [false, false, false,    # x, y, z position
                   false, false, false,    # roll, pitch, yaw angle
                   true,  true,  false,    # x, y, z speed
                   false, false, false,    # roll, pitch, yaw turning speed
                   false, false, false]    # x, y, z acceleration
    odom0_differential: false # shows the change between readings

    # IMU - turning speed from the gyro only
    imu0: /imu
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,      # yaw turning speed
                  false, false, false]
    imu0_differential: false
    imu0_remove_gravitational_acceleration: true
