# twist_mux for walker_tentacle.launch.xml: between the velocity smoother and the collision monitor.
twist_mux:
  ros__parameters:
    topics:
      navigation:
        topic: cmd_vel_smoothed       # tentacle planner -> velocity smoother
        timeout: 0.5
        priority: 10
      joystick:
        topic: cmd_vel_joy            # teleop wins
        timeout: 0.5
        priority: 100
