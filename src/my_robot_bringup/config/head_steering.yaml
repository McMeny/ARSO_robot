# Head-guided direction - how the user's head steers the walker.

tentacle_driver:
  ros__parameters:
    head_filter_time: 1.5        # s - low-pass filter, so brief glances average out
    head_deadband_deg: 12.0      # looks within this of the travel direction don't steer
    hazard_look_exclusion_deg: 10.0  # looks this close to a tagged hazard are the probe, not a choice
    open_clearance: 2.5          # m clear ahead -> the head has full say
    near_clearance: 0.8          # m clear ahead -> the machine is fully in charge
    head_timeout: 1.0            # s without head data -> the machine steers alone

    # driving along the tentacles
    max_speed: 0.26              # m/s, normal pace
    stop_distance: 0.25          # m - an arc blocked closer than this is not used
    slow_distance: 1.5           # m - slow down as the chosen arc's free length drops below this
    continuity_weight: 0.6       # preference for staying on the arc already being followed
    reverse_speed: 0.05          # m/s, backing out when boxed in
